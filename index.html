        .win98-window {
            position: absolute;
            background: #c0c0c0;
            border: 2px outset #fff;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
            width: 400px;
            font-size: 12px;
        }

        .title-bar {
            background: #000080;
            color: white;
            padding: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: #c0c0c0;
            border: 1px outset #fff;
            padding: 2px 6px;
            font-size: 9px;
            cursor: pointer;
        }

        .window-content {
            padding: 10px;
            color: #ff0000;
            text-shadow: 0 0 5px #ff0000;
        }

        #flesh-viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .status-text {
            color: #ff6600;
            font-family: "Courier New", monospace;
            text-shadow: 0 0 8px #ff6600;
            position: fixed;
            bottom: 10px;
            left: 10px;
        }

        .connection-ports {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .port {
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #ff0000, #880000);
            border: 2px solid #ff6600;
            border-radius: 50%;
            cursor: pointer;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

<body>
    <canvas id="flesh-viewport"></canvas>

    <div class="win98-window" style="top: 50px; left: 50px;">
        <div class="title-bar">
            <span>FLESH_INTERFACE.exe</span>
            <button class="close-btn">X</button>
        </div>
        <div class="window-content">
            <p>INITIALIZING BIO-DIGITAL FUSION...</p>
            <p>NERVE ENDINGS DETECTED: 2,048</p>
            <p>SYNAPTIC BANDWIDTH: 1.2 TB/s</p>
            <p>WARNING: ORGANIC FIREWALL COMPROMISED</p>
        </div>
    </div>

    <div class="connection-ports">
        <div class="port"></div>
        <div class="port"></div>
        <div class="port"></div>
    </div>

    <div class="status-text">
        > FLESH_PROTOCOL v1.98.3 ACTIVE_
    </div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';

        // Initialize scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({
            canvas: document.querySelector('#flesh-viewport'),
            alpha: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Create organic tissue material
        const fleshMaterial = new THREE.MeshPhongMaterial({
            color: 0xff0000,
            specular: 0xff6666,
            shininess: 30,
            normalScale: new THREE.Vector2(1, 1),
            wireframe: true
        });

        // Create pulsating flesh geometry
        const fleshGeometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
        const flesh = new THREE.Mesh(fleshGeometry, fleshMaterial);
        scene.add(flesh);

        // Add ambient red light
        const ambientLight = new THREE.AmbientLight(0xff0000, 0.5);
        scene.add(ambientLight);

        // Add point light
        const pointLight = new THREE.PointLight(0xff6600, 1);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        camera.position.z = 30;

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            flesh.rotation.x += 0.01;
            flesh.rotation.y += 0.01;

            // Pulsate the geometry
            const time = Date.now() * 0.001;
            flesh.scale.x = 1 + Math.sin(time) * 0.2;
            flesh.scale.y = 1 + Math.sin(time * 1.3) * 0.2;
            flesh.scale.z = 1 + Math.sin(time * 0.7) * 0.2;

            renderer.render(scene, camera);
        }

        animate();

        // Window drag functionality
        const windows = document.querySelectorAll('.win98-window');
        windows.forEach(win => {
            const titleBar = win.querySelector('.title-bar');
            let isDragging = false;
            let currentX;
            let currentY;
            let initialX;
            let initialY;

            titleBar.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', dragEnd);

            function dragStart(e) {
                initialX = e.clientX - win.offsetLeft;
                initialY = e.clientY - win.offsetTop;
                isDragging = true;
            }

            function drag(e) {
                if (isDragging) {
                    e.preventDefault();
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                    win.style.left = currentX + 'px';
                    win.style.top = currentY + 'px';
                }
            }

            function dragEnd() {
                isDragging = false;
            }
        });

        // Port click effects
        const ports = document.querySelectorAll('.port');
        ports.forEach(port => {
            port.addEventListener('click', () => {
                port.style.animation = 'none';
                port.offsetHeight; // Trigger reflow
                port.style.animation = 'pulse 2s infinite';
                
                // Create data stream particle effect
                const particles = 20;
                for (let i = 0; i < particles; i++) {
                    const particle = document.createElement('div');
                    particle.style.position = 'absolute';
                    particle.style.width = '2px';
                    particle.style.height = '2px';
                    particle.style.background = '#ff0000';
                    particle.style.left = port.offsetLeft + 'px';
                    particle.style.top = port.offsetTop + 'px';
                    document.body.appendChild(particle);

                    const angle = (Math.PI * 2 * i) / particles;
                    const velocity = 5;
                    const vx = Math.cos(angle) * velocity;
                    const vy = Math.sin(angle) * velocity;

                    let x = 0;
                    let y = 0;

                    const animate = () => {
                        x += vx;
                        y += vy;
                        particle.style.transform = `translate(${x}px, ${y}px)`;
                        if (Math.abs(x) < 100 && Math.abs(y) < 100) {
                            requestAnimationFrame(animate);
                        } else {
                            particle.remove();
                        }
                    };

                    requestAnimationFrame(animate);
                }
            });
        });
    </script>
</body>
</html>
